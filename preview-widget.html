<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ePlus Ecosystem — Widget Preview (Internal)</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#15244b;background:#eef5ff}
body{margin:0;padding:36px 18px}
main{max-width:870px;margin:0 auto}
h1{font-size:28px;margin:0 0 7px}p{color:#53678a}
a{color:#1561dc}
.sample{background:#fff;border:1px solid #dbe5f6;border-radius:18px;padding:24px;margin:20px 0;min-width:0}
.sample h2{font-size:18px;margin:0 0 15px}
.header-test{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px}
.caption{font-size:12px;margin:16px 0 0}
@media(max-width:500px){body{padding:18px 12px}.sample{padding:16px}}
</style>
<script defer src="./widget.js"></script>
</head>
<body>
<main>
<a href="./">← ePlus Ecosystem</a>
<h1>Widget preview</h1>
<p>Bản thử nghiệm hai chế độ tích hợp vào website, không áp dụng lên site khác.</p>
<section class="sample">
  <h2>Menu chuyển ứng dụng</h2>
  <div class="header-test"><strong>Website đang xem</strong><eplus-ecosystem site="onair" mode="switcher" theme="light"></eplus-ecosystem></div>
  <p class="caption">Nhấn “Ứng dụng ePlus” để xem menu.</p>
</section>
<section class="sample">
  <h2>Gợi ý theo ngữ cảnh</h2>
  <eplus-ecosystem site="camera" mode="related" theme="light"></eplus-ecosystem>
</section>
</main>
</body>
</html>
